name = "metakai-ranks"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Hourly jobs would exceed the free tier at scale; every 6 hours is plenty for distributions.
[triggers]
crons = ["17 */6 * * *"]

[vars]
# Public OAuth client IDs the app requests Google ID tokens for: the web client, then (once the
# free-software Android build's client exists) its ID after a comma.
GOOGLE_CLIENT_ID = "510560795620-br9d6gv72om2rfgk4rmrdkjhssebh1ac.apps.googleusercontent.com"
# iOS bundle ID, the audience of Sign in with Apple tokens.
APPLE_BUNDLE_ID = "com.tfthushaar.metakai"

[[d1_databases]]
binding = "DB"
database_name = "metakai-ranks"
database_id = "ad477ad5-92ca-4315-a8e4-86f940a92997"
migrations_dir = "migrations"
