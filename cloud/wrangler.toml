name = "metakai-ranks"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Hourly jobs would exceed the free tier at scale; every 6 hours is plenty for distributions.
[triggers]
crons = ["17 */6 * * *"]

[vars]
# Public OAuth web client ID the app requests Google ID tokens for.
GOOGLE_CLIENT_ID = "510560795620-br9d6gv72om2rfgk4rmrdkjhssebh1ac.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "metakai-ranks"
# Filled in by `npx wrangler d1 create metakai-ranks`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
