License: MIT
AuthorName: tfthushaar
WebSite: https://tfthushaar.github.io/metakai/
SourceCode: https://github.com/tfthushaar/metakai
IssueTracker: https://github.com/tfthushaar/metakai/issues
Changelog: https://github.com/tfthushaar/metakai/releases

AntiFeatures:
  NonFreeNet:
    en-US: Optional online features use Google Drive (backup) and Google sign-in (leaderboards), and the optional AI food analysis uses Google Gemini or Groq with the user's own key.

RepoType: git
Repo: https://github.com/tfthushaar/metakai.git

Builds:
  - versionName: 1.5.0
    versionCode: 19
    commit: v1.5.0
    subdir: app
    sudo:
      - curl -Lo node.tar.gz https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-x64.tar.gz
      - echo "2faf6a387e9b62b888e21c54f01249fb27537ffecf1842f29f4c919d0a59a0ff  node.tar.gz" | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init:
      - node ../scripts/flavor.mjs foss --remove-packages --from-source
      - npm ci --no-audit --no-fund
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - export EXPO_NO_TELEMETRY=1
      - npx expo prebuild --platform android --clean --no-install
      - sed -i '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> android/gradle.properties
    scanignore:
      - node_modules/hermes-compiler/hermesc
    scandelete:
      - node_modules
    build:
      - export EXPO_NO_TELEMETRY=1
      - cd android
      - gradle assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
    ndk: r27b

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/app.json|"versionCode":\s*(\d+)|app/app.json|"version":\s*"([^"]+)"
CurrentVersion: 1.5.0
CurrentVersionCode: 19
