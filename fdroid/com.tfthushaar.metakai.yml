Builds:
  - versionName: 1.5.0
    versionCode: 19
    commit: a4a9a1be8307dc6050588d9fdb0a83bdbda66868
    subdir: app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init:
      - node ../scripts/flavor.mjs foss --remove-packages --from-source
      - npm ci --no-audit --no-fund
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    rm:
      - app/public/sqljs
      - docs/app
    prebuild:
      - export EXPO_NO_TELEMETRY=1
      - npx expo prebuild --platform android --clean --no-install
      - sed -i '/^ *signingConfig /d' android/app/build.gradle
      - sed -i '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i 's/jvmToolchain(17)/jvmToolchain(21)/' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/fromTarget("17")/fromTarget("21")/'
        node_modules/react-native-reanimated/android/build.gradle.kts node_modules/react-native-worklets/android/build.gradle.kts
      - printf '\norg.gradle.jvmargs=-Xmx3g 
        -XX:MaxMetaspaceSize=768m\nkotlin.daemon.jvmargs=-Xmx1536m\norg.gradle.workers.max=4\n'
        >> android/gradle.properties
    scanignore:
      - app/node_modules/@react-native-masked-view/masked-view/android/build.gradle
      - app/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - app/node_modules/hermes-compiler/hermesc
      - app/node_modules/react-native-safe-area-context/android/build.gradle
      - app/node_modules/react-native-screens/android/build.gradle
      - app/node_modules/react-native-svg/android/build.gradle
      - app/node_modules/react-native-view-shot/android/build.gradle
      - app/node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - app/node_modules
    build:
      - export EXPO_NO_TELEMETRY=1
      - cd android
      - gradle assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
        -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
    ndk: r27b

